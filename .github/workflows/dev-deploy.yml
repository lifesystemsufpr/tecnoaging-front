name: Deploy TecnoAging (web/dev)

on:
  push:
    branches:
      - devV2

env:
  PM2_APP_NAME: TecnoAging-front
  APP_DIR: /opt/tecnoaging/front

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # ✅ valida build (CI)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 🚀 envia código (sem .next)
      - name: Deploy código para servidor
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.next' --exclude='.env'
          path: ./
          remote_path: ${{ env.APP_DIR }}
          remote_host: ${{ secrets.DEVENV_SSH_HOST  }}
          remote_user: ${{ secrets.DEVENV_SSH_USER }}
          remote_key: ${{ secrets.DEVENV_SSH_KEY  }}

      # 🧠 build real + restart
      - name: Build & restart no servidor
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEVENV_SSH_HOST }}
          username: ${{ secrets.DEVENV_SSH_USER }}
          key: ${{ secrets.DEVENV_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}

            cat << 'EOF' > .env
            ${{ secrets.DEVENV_FILE }}
            EOF

            npm install
            npm run build

            pm2 restart ${{ env.PM2_APP_NAME }} || pm2 start ecosystem.config.cjs --name ${{ env.PM2_APP_NAME }}