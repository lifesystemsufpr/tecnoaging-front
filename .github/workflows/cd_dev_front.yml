name: DEVENV - Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout do código
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Node.js
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -------------------------------
      # Install dependencies (CI)
      # -------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------
      # Build frontend (Next.js)
      # -------------------------------
      - name: Build frontend
        run: npm run build

      # -------------------------------
      # Garantir diretório no servidor
      # -------------------------------
      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEVENV_SSH_HOST }}
          username: ${{ secrets.DEVENV_SSH_USER }}
          key: ${{ secrets.DEVENV_SSH_KEY }}
          script: |
            mkdir -p /opt/tecnoaging/front/current
            chown -R $USER:$USER /opt/tecnoaging/front

      # -------------------------------
      # Sincronizar arquivos (rsync)
      # -------------------------------
      - name: Deploy files via rsync
        uses: burnett01/rsync-deployments@v6.0.0
        with:
          switches: -avz --delete
          path: ./
          remote_path: /opt/tecnoaging/front/current
          remote_host: ${{ secrets.DEVENV_SSH_HOST }}
          remote_user: ${{ secrets.DEVENV_SSH_USER }}
          remote_key: ${{ secrets.DEVENV_SSH_KEY }}

      # -------------------------------
      # Instalar dependências de produção
      # e iniciar/recarregar PM2
      # -------------------------------
      - name: Install prod deps and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEVENV_SSH_HOST }}
          username: ${{ secrets.DEVENV_SSH_USER }}
          key: ${{ secrets.DEVENV_SSH_KEY }}
          script: |
            cd /opt/tecnoaging/front/current
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js || pm2 start ecosystem.config.js