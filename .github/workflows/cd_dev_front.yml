name: DEVENV - Deploy Frontend

on:
  push:
    branches:
      - devOld

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Node.js
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -------------------------------
      # Install dependencies (CI)
      # -------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------
      # Build frontend
      # -------------------------------
      - name: Build frontend
        run: npm run build

      # -------------------------------
      # Configure SSH (EXPLÍCITO)
      # -------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEVENV_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEVENV_SSH_HOST }} >> ~/.ssh/known_hosts

      # -------------------------------
      # Prepare server directory
      # -------------------------------
      - name: Prepare server directory
        run: |
          ssh ${{ secrets.DEVENV_SSH_USER }}@${{ secrets.DEVENV_SSH_HOST }} << 'EOF'
            set -e
            mkdir -p /opt/tecnoaging/front/current
            chown -R $USER:$USER /opt/tecnoaging/front
          EOF

      # -------------------------------
      # Rsync files (determinístico)
      # -------------------------------
      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".env*" \
            ./ \
            ${{ secrets.DEVENV_SSH_USER }}@${{ secrets.DEVENV_SSH_HOST }}:/opt/tecnoaging/front/current

      # -------------------------------
      # Install prod deps & restart PM2
      # -------------------------------
      - name: Install prod deps and restart PM2
        run: |
          ssh ${{ secrets.DEVENV_SSH_USER }}@${{ secrets.DEVENV_SSH_HOST }} << 'EOF'
            set -e
            cd /opt/tecnoaging/front/current
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
          EOF
