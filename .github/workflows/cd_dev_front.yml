name: DEVENV - Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create target dir
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEVENV_SSH_HOST }}
          username: ${{ secrets.DEVENV_SSH_USER }}
          key: ${{ secrets.DEVENV_SSH_KEY }}
          script: |
            mkdir -p /opt/tecnoaging/front/current
            chown -R azureuser:azureuser /opt/tecnoaging/front

      - name: Rsync files
        uses: burnett01/rsync-deployments@v7
        with:
          switches: -avz --delete
          path: ./
          remote_path: /opt/tecnoaging/front/current
          remote_host: ${{ secrets.DEVENV_SSH_HOST }}
          remote_user: ${{ secrets.DEVENV_SSH_USER }}
          remote_key: ${{ secrets.DEVENV_SSH_KEY }}

      - name: Install prod deps & restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEVENV_SSH_HOST }}
          username: ${{ secrets.DEVENV_SSH_USER }}
          key: ${{ secrets.DEVENV_SSH_KEY }}
          script: |
            cd /opt/tecnoaging/front/current
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js || pm2 start ecosystem.config.js