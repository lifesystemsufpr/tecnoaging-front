name: Frontend CI - Pull Request Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-lint:
    name: Build and Lint Frontend
    runs-on: ubuntu-latest

    env:
      # Dummy value required for build
      NEXT_PUBLIC_API_BASE_URL: "https://api.dev.tecnoaging.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

