# ---------- CORS allowlist (precisa estar no nível http) ----------
# OBS: CORS valida somente scheme://host[:port]
# Atualizado para aceitar tecnoaging.com.br (com e sem www)

map $http_origin $cors_ok {
  default "";
  # Regex ajustada para pegar http ou https, com ou sem www, no dominio .com.br
  "~^https?://(www\.)?tecnoaging\.com\.br(?::\d+)?$" $http_origin;
}

# -------------------------------
# Redirect HTTP -> HTTPS
# -------------------------------
server {
  listen 80;
  # Aceita tanto com www quanto sem
  server_name tecnoaging.com.br www.tecnoaging.com.br;
  return 301 https://tecnoaging.com.br$request_uri;
}

# -------------------------------
# HTTPS vhost
# -------------------------------
server {
  listen 443 ssl http2;
  server_name tecnoaging.com.br www.tecnoaging.com.br;

  # --- TLS (CAMINHOS ATUALIZADOS PARA O NOVO DOMÍNIO) ---
  # Verifique se a pasta é exatamente esta após rodar o certbot
  ssl_certificate     /etc/letsencrypt/live/tecnoaging.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tecnoaging.com.br/privkey.pem;
  
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # --- Headers de segurança básicos ---
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # --- CORREÇÃO ERRO 400 (COOKIES/HEADERS GRANDES) ---
  # Atualizado para remover diretivas obsoletas do HTTP2
  large_client_header_buffers 8 64k; # Aumentado para 64k para garantir
  proxy_buffers 8 64k;
  proxy_buffer_size 64k;
  # ----------------------------------------------------

  # ============================
  # /api/status → Backend health check
  # ============================
  location = /api/status {
    if ($request_method = OPTIONS) {
      add_header Vary "Origin" always;
      add_header Access-Control-Allow-Origin $cors_ok always;
      add_header Access-Control-Allow-Methods "GET,OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }

    add_header Vary "Origin" always;
    add_header Access-Control-Allow-Origin $cors_ok always;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    proxy_pass http://localhost:3333/status;
  }

  # ============================
  # /backend → Backend API (NestJS)
  # ============================
  location /backend/ {
    # Preflight CORS
    if ($request_method = OPTIONS) {
      add_header Vary "Origin" always;
      add_header Access-Control-Allow-Origin $cors_ok always;
      add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    add_header Vary "Origin" always;
    add_header Access-Control-Allow-Origin $cors_ok always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_pass http://localhost:3333/;
  }

  # ============================
  # / → Frontend (Next.js)
  # ============================
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_pass http://localhost:3000;
  }

  access_log /var/log/nginx/tecno-aging-access.log;
  error_log  /var/log/nginx/tecno-aging-error.log;
}
