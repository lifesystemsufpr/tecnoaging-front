services:
  frontend:
    image: ${FRONTEND_IMAGE:?Informe FRONTEND_IMAGE}:${IMAGE_TAG:?Informe IMAGE_TAG}
    restart: unless-stopped
    init: true
    env_file:
      - .env.prod
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8082}:3000"
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
